name: harness-ci

# The repo's own done-criterion (harness/GUARDRAILS.md C): a mechanical run, not
# a self-assessment. `make verify` existed long before this workflow but only ran
# when someone typed it — this is the trigger, not new checking logic. New checks
# belong in the Makefile or scripts/, never inline here.

on:
  pull_request:
  push:
    branches: [main]

# The job runs code from the PR branch, so it gets no more than it needs.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # pinned to a commit, not a moving tag — APPLY.md A4 asks the same of every
      # external component
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - run: make verify
